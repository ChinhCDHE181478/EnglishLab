spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.charset.console=UTF-8
logging.charset.file=UTF-8

app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.classroom-demo.enabled=${APP_SEED_CLASSROOM_DEMO_ENABLED:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/englishlab?options=-c%20timezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

jwt.secret=${JWT_SECRET:englishlab-local-development-secret-change-before-production}
jwt.expiration=86400000

google.client-id=550203681762-29kpjelfmfu7q62qfgh72qft0lgfun3f.apps.googleusercontent.com

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# Account avatar storage (individual avatar uploads are limited to 1 MB in the service)
englishlab.avatars.dir=${ENGLISHLAB_AVATARS_DIR:backend/uploads/avatars}

bunny.stream.library-id=${BUNNY_STREAM_LIBRARY_ID:}
bunny.stream.cdn-hostname=${BUNNY_STREAM_CDN_HOSTNAME:}
bunny.stream.api-key=${BUNNY_STREAM_API_KEY:}
bunny.stream.readonly-api-key=${BUNNY_STREAM_READONLY_API_KEY:}

# Email delivery
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

englishlab.mail.enabled=${ENGLISHLAB_MAIL_ENABLED:true}
englishlab.mail.from=${ENGLISHLAB_MAIL_FROM:${MAIL_USERNAME:}}
englishlab.mail.from-name=${ENGLISHLAB_MAIL_FROM_NAME:EnglishLab}
englishlab.mail.base-url=${ENGLISHLAB_WEB_BASE_URL:http://localhost:5173}
englishlab.mail.logo-url=${ENGLISHLAB_MAIL_LOGO_URL:}
englishlab.mail.hero-image-url=${ENGLISHLAB_MAIL_HERO_IMAGE_URL:}
englishlab.mail.support-email=${ENGLISHLAB_SUPPORT_EMAIL:englishlab.edu.vn@gmail.com}
englishlab.mail.support-center-url=${ENGLISHLAB_SUPPORT_CENTER_URL:http://localhost:5173/support}
englishlab.mail.privacy-policy-url=${ENGLISHLAB_PRIVACY_POLICY_URL:http://localhost:5173/privacy}
englishlab.auth.email-verification-expiration-minutes=${ENGLISHLAB_AUTH_EMAIL_VERIFICATION_EXPIRATION_MINUTES:15}
englishlab.auth.password-reset-expiration-minutes=${ENGLISHLAB_AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:15}

# Real AI evaluation for online course assessments
# No mock/fake feedback is used. If a key is missing, the API returns a clear error.
englishlab.ai.enabled=${ENGLISHLAB_AI_ENABLED:true}
englishlab.ai.provider=${ENGLISHLAB_AI_PROVIDER:gemini}
englishlab.ai.request-timeout-seconds=${ENGLISHLAB_AI_TIMEOUT_SECONDS:60}
englishlab.ai.temperature=${ENGLISHLAB_AI_TEMPERATURE:0.2}

# Gemini provider
englishlab.ai.gemini.api-key=${GEMINI_API_KEY:}
englishlab.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
englishlab.ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.5-flash-lite,gemini-2.0-flash,gemini-2.0-flash-lite}
englishlab.ai.gemini.max-retries=${GEMINI_MAX_RETRIES:2}
englishlab.ai.gemini.inline-audio-max-bytes=${GEMINI_INLINE_AUDIO_MAX_BYTES:20971520}

# OpenAI provider
englishlab.ai.openai.api-key=${OPENAI_API_KEY:}
englishlab.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# payOS payment
englishlab.payos.enabled=${ENGLISHLAB_PAYOS_ENABLED:false}
englishlab.payos.client-id=${PAYOS_CLIENT_ID:}
englishlab.payos.api-key=${PAYOS_API_KEY:}
englishlab.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
englishlab.payos.return-url=${ENGLISHLAB_PAYOS_RETURN_URL:http://localhost:5173/checkout}
englishlab.payos.cancel-url=${ENGLISHLAB_PAYOS_CANCEL_URL:http://localhost:5173/checkout}
englishlab.payos.webhook-url=${ENGLISHLAB_PAYOS_WEBHOOK_URL:http://localhost:8080/api/payos/webhook}
englishlab.payos.auto-confirm-webhook=${ENGLISHLAB_PAYOS_AUTO_CONFIRM_WEBHOOK:true}

# Lark custom app
englishlab.lark.enabled=${LARK_ENABLED:false}
englishlab.lark.app-id=${LARK_APP_ID:}
englishlab.lark.app-secret=${LARK_APP_SECRET:}
englishlab.lark.calendar-id=${LARK_CALENDAR_ID:}
englishlab.lark.calendar-name=${LARK_CALENDAR_NAME:EnglishLab Virtual Training}
englishlab.lark.timezone=${LARK_TIMEZONE:Asia/Ho_Chi_Minh}
englishlab.lark.base-url=${LARK_BASE_URL:https://open.larksuite.com/open-apis}
englishlab.lark.verification-token=${LARK_VERIFICATION_TOKEN:}
englishlab.lark.auto-record=${LARK_AUTO_RECORD:false}
englishlab.lark.recording-auto-publish=${LARK_RECORDING_AUTO_PUBLISH:false}
englishlab.lark.default-owner-open-id=${LARK_DEFAULT_OWNER_OPEN_ID:}
englishlab.lark.recording-max-sync-attempts=${LARK_RECORDING_MAX_SYNC_ATTEMPTS:20}
englishlab.lark.recording-sync-delay-ms=${LARK_RECORDING_SYNC_DELAY_MS:60000}
englishlab.lark.reserve-reconciliation-delay-ms=${LARK_RESERVE_RECONCILIATION_DELAY_MS:3600000}
englishlab.lark.reserve-reconciliation-initial-delay-ms=${LARK_RESERVE_RECONCILIATION_INITIAL_DELAY_MS:120000}
englishlab.lark.recording-expiry-check-delay-ms=${LARK_RECORDING_EXPIRY_CHECK_DELAY_MS:300000}
