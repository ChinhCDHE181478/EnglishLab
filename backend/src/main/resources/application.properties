spring.application.name=${SPRING_APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${SERVER_PORT}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.charset.console=UTF-8
logging.charset.file=UTF-8

app.seed.test.enabled=${APP_SEED_TEST_ENABLED}
app.seed.review.enabled=${APP_SEED_REVIEW_ENABLED}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

google.client-id=${GOOGLE_LOGIN_CLIENT_ID}

# Google Meet room creation. Each teacher connects their own Google account.
englishlab.google-meet.enabled=${GOOGLE_MEET_ENABLED}
englishlab.google-meet.client-id=${GOOGLE_MEET_CLIENT_ID}
englishlab.google-meet.client-secret=${GOOGLE_MEET_CLIENT_SECRET}
englishlab.google-meet.authorization-uri=${GOOGLE_MEET_AUTHORIZATION_URI}
englishlab.google-meet.token-uri=${GOOGLE_MEET_TOKEN_URI}
englishlab.google-meet.api-base-url=${GOOGLE_MEET_API_BASE_URL}
englishlab.google-meet.redirect-uri=${GOOGLE_MEET_REDIRECT_URI}
englishlab.google-meet.frontend-return-url=${GOOGLE_MEET_FRONTEND_RETURN_URL}
englishlab.google-meet.token-encryption-key=${GOOGLE_MEET_TOKEN_ENCRYPTION_KEY}
englishlab.google-meet.retry-delay-ms=${GOOGLE_MEET_RETRY_DELAY_MS}
englishlab.google-meet.retry-initial-delay-ms=${GOOGLE_MEET_RETRY_INITIAL_DELAY_MS}
englishlab.google-meet.auto-recording=${GOOGLE_MEET_AUTO_RECORDING}
englishlab.google-meet.recording-auto-publish=${GOOGLE_MEET_RECORDING_AUTO_PUBLISH}
englishlab.google-meet.recording-max-sync-attempts=${GOOGLE_MEET_RECORDING_MAX_SYNC_ATTEMPTS}
englishlab.google-meet.recording-sync-delay-ms=${GOOGLE_MEET_RECORDING_SYNC_DELAY_MS}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# Account avatar storage (individual avatar uploads are limited to 1 MB in the service)
englishlab.avatars.dir=${ENGLISHLAB_AVATARS_DIR}

bunny.stream.library-id=${BUNNY_STREAM_LIBRARY_ID}
bunny.stream.cdn-hostname=${BUNNY_STREAM_CDN_HOSTNAME}
bunny.stream.api-key=${BUNNY_STREAM_API_KEY}
bunny.stream.readonly-api-key=${BUNNY_STREAM_READONLY_API_KEY}

# Email delivery
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}

englishlab.mail.enabled=${ENGLISHLAB_MAIL_ENABLED}
englishlab.mail.from=${ENGLISHLAB_MAIL_FROM}
englishlab.mail.from-name=${ENGLISHLAB_MAIL_FROM_NAME}
englishlab.mail.base-url=${ENGLISHLAB_WEB_BASE_URL}
englishlab.mail.logo-url=${ENGLISHLAB_MAIL_LOGO_URL}
englishlab.mail.hero-image-url=${ENGLISHLAB_MAIL_HERO_IMAGE_URL}
englishlab.mail.support-email=${ENGLISHLAB_SUPPORT_EMAIL}
englishlab.mail.support-center-url=${ENGLISHLAB_SUPPORT_CENTER_URL}
englishlab.mail.privacy-policy-url=${ENGLISHLAB_PRIVACY_POLICY_URL}
englishlab.auth.email-verification-expiration-minutes=${ENGLISHLAB_AUTH_EMAIL_VERIFICATION_EXPIRATION_MINUTES}
englishlab.auth.password-reset-expiration-minutes=${ENGLISHLAB_AUTH_PASSWORD_RESET_EXPIRATION_MINUTES}

# Real AI evaluation for online course assessments
# No mock/fake feedback is used. If a key is missing, the API returns a clear error.
englishlab.ai.enabled=${ENGLISHLAB_AI_ENABLED}
englishlab.ai.provider=${ENGLISHLAB_AI_PROVIDER}
englishlab.ai.request-timeout-seconds=${ENGLISHLAB_AI_TIMEOUT_SECONDS}
englishlab.ai.temperature=${ENGLISHLAB_AI_TEMPERATURE}

# Gemini provider
englishlab.ai.gemini.api-key=${GEMINI_API_KEY}
englishlab.ai.gemini.model=${GEMINI_MODEL}
englishlab.ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS}
englishlab.ai.gemini.max-retries=${GEMINI_MAX_RETRIES}
englishlab.ai.gemini.inline-audio-max-bytes=${GEMINI_INLINE_AUDIO_MAX_BYTES}

# OpenAI provider
englishlab.ai.openai.api-key=${OPENAI_API_KEY}
englishlab.ai.openai.model=${OPENAI_MODEL}

# payOS payment
englishlab.payos.enabled=${ENGLISHLAB_PAYOS_ENABLED}
englishlab.payos.client-id=${PAYOS_CLIENT_ID}
englishlab.payos.api-key=${PAYOS_API_KEY}
englishlab.payos.checksum-key=${PAYOS_CHECKSUM_KEY}
englishlab.payos.return-url=${ENGLISHLAB_PAYOS_RETURN_URL}
englishlab.payos.cancel-url=${ENGLISHLAB_PAYOS_CANCEL_URL}
englishlab.payos.webhook-url=${ENGLISHLAB_PAYOS_WEBHOOK_URL}
englishlab.payos.auto-confirm-webhook=${ENGLISHLAB_PAYOS_AUTO_CONFIRM_WEBHOOK}

# Lark custom app
englishlab.lark.enabled=${LARK_ENABLED}
englishlab.lark.app-id=${LARK_APP_ID}
englishlab.lark.app-secret=${LARK_APP_SECRET}
englishlab.lark.calendar-id=${LARK_CALENDAR_ID}
englishlab.lark.calendar-name=${LARK_CALENDAR_NAME}
englishlab.lark.timezone=${LARK_TIMEZONE}
englishlab.lark.base-url=${LARK_BASE_URL}
englishlab.lark.verification-token=${LARK_VERIFICATION_TOKEN}
englishlab.lark.auto-record=${LARK_AUTO_RECORD}
englishlab.lark.recording-auto-publish=${LARK_RECORDING_AUTO_PUBLISH}
englishlab.lark.default-owner-open-id=${LARK_DEFAULT_OWNER_OPEN_ID}
englishlab.lark.recording-max-sync-attempts=${LARK_RECORDING_MAX_SYNC_ATTEMPTS}
englishlab.lark.recording-sync-delay-ms=${LARK_RECORDING_SYNC_DELAY_MS}
englishlab.lark.reserve-reconciliation-delay-ms=${LARK_RESERVE_RECONCILIATION_DELAY_MS}
englishlab.lark.reserve-reconciliation-initial-delay-ms=${LARK_RESERVE_RECONCILIATION_INITIAL_DELAY_MS}
englishlab.lark.recording-expiry-check-delay-ms=${LARK_RECORDING_EXPIRY_CHECK_DELAY_MS}
