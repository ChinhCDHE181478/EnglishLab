spring.datasource.url=jdbc:h2:mem:englishlab_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.config.import=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.test-connection=false

jwt.secret=englishlab-isolated-test-secret-at-least-32-characters
jwt.expiration=3600000
google.client-id=englishlab-test-google-client

app.seed.test.enabled=false
app.seed.review.enabled=false
app.seed.sheet.enabled=false
app.seed.assessment-reference.enabled=false

englishlab.mail.enabled=false
englishlab.google-meet.enabled=false
englishlab.lark.enabled=false
englishlab.payos.enabled=false
englishlab.ai.enabled=false

debug=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
