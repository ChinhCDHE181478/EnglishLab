# Slice 0: PostgreSQL + Flyway (local englishlab_sheet). Override via env if needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/englishlab_sheet?options=-c%20timezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

spring.application.name=backend
server.port=0

jwt.secret=${JWT_SECRET:englishlab-isolated-test-secret-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:3600000}
google.client-id=${GOOGLE_LOGIN_CLIENT_ID:englishlab-test-google-client}

app.seed.test.enabled=false
app.seed.review.enabled=false
app.seed.sheet.enabled=false

englishlab.mail.enabled=false
englishlab.google-meet.enabled=false
englishlab.lark.enabled=false
englishlab.payos.enabled=false
englishlab.ai.enabled=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.test-connection=false

spring.config.import=
